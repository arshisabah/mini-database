server.port=8080
# minidb.storage.path=./minidb-data

# If you serve Frontend/ with VS Code's Live Server (port 5500) and keep
# seeing the frontend "disconnect" right after every operation, Live
# Server is force-reloading the page because it sees the folder above
# change on every write. See README.md's Live Server note. The .vscode
# ignore config fixes that for most setups; if it still happens, point
# storage somewhere Live Server never watches at all, e.g.:
# minidb.storage.path=${user.home}/minidb-data
minidb.storage.path=${user.home}/minidb-data